name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.29
      - run: uv sync --locked --extra dev --extra market
      - run: uv run pytest -q
      - run: uv run ruff check src/alpharesearchos scripts
      - run: node --check src/alpharesearchos/static/app.js
      - run: uv run python scripts/check_release.py
      - run: uv run alphaos --help
      - run: uv build
